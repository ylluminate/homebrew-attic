name: sync

# Keep the attic in step with Homebrew's ongoing cask deprecations.
# Re-runs the engine, commits any newly-rescued or updated casks.

on:
  schedule:
    - cron: "17 6 * * 0"   # weekly, Sundays 06:17 UTC
  workflow_dispatch: {}     # manual trigger

permissions:
  contents: write

concurrency:
  group: attic-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Rescue current deprecated/disabled casks
        run: python3 bin/attic-sync

      - name: Commit and push changes
        run: |
          git config user.name "attic-sync[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "sync $(date -u +%F): refresh rescued casks"
            git push
          else
            echo "no changes"
          fi
